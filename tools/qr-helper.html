<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>印迹溯源二维码生成辅助页</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: "Microsoft YaHei", Arial, sans-serif;
        background: #071a2f;
        color: #fff;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        background: #fffaf0;
        color: #172033;
        border-radius: 22px;
        padding: 22px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        font-size: 15px;
      }

      button,
      a {
        display: inline-block;
        margin-top: 12px;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        background: #c43a32;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      #qr {
        margin-top: 18px;
        display: grid;
        place-items: center;
        min-height: 220px;
        border: 1px dashed #d8a64a;
        border-radius: 16px;
        background: #fff;
      }

      .hint {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>印迹溯源二维码生成辅助页</h1>
      <p>部署 GitHub Pages 后，把页面链接粘贴到下面。若当前浏览器无法加载二维码脚本，可使用草料二维码/联图二维码生成同一链接。</p>
      <input id="url" value="https://你的用户名.github.io/yinji-suyuan-memory/" />
      <button onclick="makeQR()">生成二维码</button>
      <a id="download" download="yinji-suyuan-qr.png" style="display: none">下载二维码</a>
      <div id="qr">二维码会显示在这里</div>
      <p class="hint">二维码旁建议配文：扫码查看我的数字文旅记忆｜MVP 阶段二维码验证，后续升级为 NFC 触碰访问。</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script>
      function makeQR() {
        const url = document.getElementById("url").value.trim();
        const qr = document.getElementById("qr");
        const download = document.getElementById("download");
        qr.innerHTML = "";
        if (!window.QRCode) {
          qr.textContent = "二维码脚本加载失败。请把链接复制到草料二维码或联图二维码生成。";
          return;
        }
        const canvas = document.createElement("canvas");
        QRCode.toCanvas(canvas, url, {
          width: 260,
          margin: 2,
          color: { dark: "#071a2f", light: "#ffffff" },
          errorCorrectionLevel: "H",
        });
        qr.appendChild(canvas);
        download.href = canvas.toDataURL("image/png");
        download.style.display = "inline-block";
      }
    </script>
  </body>
</html>
